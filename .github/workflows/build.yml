name: Build

# Every push to main or feat/** builds Windows, Linux and macOS. Pushing a tag vX.Y.Z (the version in CMakeLists.txt)
# publishes a release with:
# ArkeyanLauncher.exe, ArkeyanLauncher-x86_64.AppImage, ArkeyanLauncher-macOS.dmg and ArkeyanLauncher-macOS.zip (the .app), and
# SHA256SUMS (their SHA-256, which the launcher's updater checks; docs/updates.md). Branches and pull requests only build,
# with the version in CMakeLists.txt.
on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: pwsh
        run: |
          $extra = @()
          $version = $env:VERSION.TrimStart('v')
          if ($version) { $extra += "-DLAUNCHER_VERSION=$version" }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl @extra
          cmake --build build --target ArkeyanLauncher
          # The checks that need no disc image (the others need the player's own).
          cmake --build build --target ArkeyanLauncherTest FakeSkyBuild
          $env:SDL_VIDEO_DRIVER = 'offscreen'
          $env:SDL_AUDIO_DRIVER = 'dummy'
          .\build\ArkeyanLauncherTest.exe --no-disc "$env:RUNNER_TEMP\launcher-test"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/ArkeyanLauncher.exe dist/ArkeyanLauncher.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    # 22.04: the AppImage needs the glibc it was built against (2.35), and the game kit's baseline is 2.34.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-15 libstdc++-12-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev librsvg2-bin libfuse2
      - name: Build
        # XenonUtils' headers rely on Clang (anonymous structs with non-trivial members), as XenonRecomp does.
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-15 -DCMAKE_CXX_COMPILER=clang++-15 \
            ${VERSION:+"-DLAUNCHER_VERSION=${VERSION#v}"}
          cmake --build build --target ArkeyanLauncher
          # The checks that need no disc image (the others need the player's own).
          cmake --build build --target ArkeyanLauncherTest FakeSkyBuild
          SDL_VIDEO_DRIVER=offscreen SDL_AUDIO_DRIVER=dummy build/ArkeyanLauncherTest --no-disc "$RUNNER_TEMP/launcher-test"
          cmake --install build --prefix AppDir/usr
      - name: AppImage
        run: |
          rsvg-convert -w 256 -h 256 resources/icons/skylauncher.svg -o skylauncher.png
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          ./linuxdeploy --appimage-extract-and-run --appdir AppDir -e AppDir/usr/bin/ArkeyanLauncher \
            -d resources/linux/skylauncher.desktop -i skylauncher.png --output appimage
          mkdir -p dist
          mv Arkeyan*.AppImage dist/ArkeyanLauncher-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: brew install ninja librsvg
      # Apple Silicon only, as the game kit: on an Intel Mac, macOS refuses the app instead of a failed install.
      - name: Build (Apple Silicon)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 ${VERSION:+"-DLAUNCHER_VERSION=${VERSION#v}"}
          cmake --build build --target ArkeyanLauncher
          # The checks that need no disc image (the others need the player's own).
          cmake --build build --target ArkeyanLauncherTest FakeSkyBuild
          SDL_VIDEO_DRIVER=offscreen SDL_AUDIO_DRIVER=dummy build/ArkeyanLauncherTest --no-disc "$RUNNER_TEMP/launcher-test"
      - name: Icon, signature, .dmg and .zip
        run: tools/package_macos.sh build/ArkeyanLauncher.app resources/icons/skylauncher.svg dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    needs: [windows, linux, macos]
    # Only a v* tag publishes, and never a pre-release tag (v1.2.3-beta.1): those are published by hand, marked as pre-releases.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The launcher's updater checks every download against this file (docs/updates.md): one line per asset.
          (cd dist && sha256sum ArkeyanLauncher.exe ArkeyanLauncher-x86_64.AppImage ArkeyanLauncher-macOS.dmg ArkeyanLauncher-macOS.zip > SHA256SUMS && cat SHA256SUMS)
          # The notes are docs/releases/<tag>.md when it exists.
          if [ -f "docs/releases/$VERSION.md" ]; then
            gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Arkeyan Launcher $VERSION" --notes-file "docs/releases/$VERSION.md"
          else
            notes="Built from ${GITHUB_SHA::7}. You need your own copy of the game; see the README."
            gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Arkeyan Launcher $VERSION" --notes "$notes"
          fi
