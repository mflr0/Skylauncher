name: Build

# Every push to main or feat/** builds Windows, Linux and macOS; main then publishes a release tagged v0.1.<run number> with:
# Skylauncher.exe, Skylauncher-x86_64.AppImage, Skylauncher-macOS.dmg and Skylauncher-macOS.zip (the .app).
# Pushing a tag v* publishes that tag instead. Pull requests only build.
on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v0.1.{0}', github.run_number) }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        shell: pwsh
        run: |
          $version = "${{ env.VERSION }}".TrimStart('v')
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DSKYLAUNCHER_VERSION="$version"
          cmake --build build --target Skylauncher
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Skylauncher.exe dist/Skylauncher.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev librsvg2-bin libfuse2
      - name: Build
        # XenonUtils' headers rely on Clang (anonymous structs with non-trivial members), as XenonRecomp does.
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DSKYLAUNCHER_VERSION="${VERSION#v}"
          cmake --build build --target Skylauncher
          cmake --install build --prefix AppDir/usr
      - name: AppImage
        run: |
          rsvg-convert -w 256 -h 256 resources/icons/skylauncher.svg -o skylauncher.png
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          ./linuxdeploy --appimage-extract-and-run --appdir AppDir -e AppDir/usr/bin/Skylauncher \
            -d resources/linux/skylauncher.desktop -i skylauncher.png --output appimage
          mkdir -p dist
          mv Skylauncher*.AppImage dist/Skylauncher-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: brew install ninja librsvg
      - name: Build (Apple Silicon + Intel)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DSKYLAUNCHER_VERSION="${VERSION#v}"
          cmake --build build --target Skylauncher
      - name: Icon, signature, .dmg and .zip
        run: |
          app=build/Skylauncher.app
          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            rsvg-convert -w $size -h $size resources/icons/skylauncher.svg -o icon.iconset/icon_${size}x${size}.png
            rsvg-convert -w $((size * 2)) -h $((size * 2)) resources/icons/skylauncher.svg -o icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/Skylauncher.icns"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile Skylauncher" "$app/Contents/Info.plist" || /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string Skylauncher" "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"   # ad hoc: not notarized, see the README
          mkdir -p dist dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Skylauncher -srcfolder dmg -ov -format UDZO dist/Skylauncher-macOS.dmg
          ditto -c -k --keepParent "$app" dist/Skylauncher-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    needs: [windows, linux, macos]
    # Feature branches only build; main and v* tags publish.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7}. You need your own copy of the game and the SSARecomp runtime next to the launcher; see the README."
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Skylauncher $VERSION" --notes "$notes"
